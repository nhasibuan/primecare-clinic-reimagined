# Compiles TypeScript, runs tests, and verifies the production build on every
# dependency update PR, so bumps that break the app fail CI instead of
# silently shipping.
name: Dependencies

on:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Unit & integration tests
        run: pnpm test

      - name: Production build
        run: pnpm build
