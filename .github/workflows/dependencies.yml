# Compiles TypeScript, runs tests, and verifies the production build on every
# dependency update PR, so bumps that break the app fail CI instead of
# silently shipping.
#
# The audit job also runs on pushes to main and weekly: new advisories can be
# published against unchanged, locked dependency versions at any time, and the
# gate should catch those too. It audits the production dependency tree only —
# the one accepted finding (esbuild inside drizzle-kit's dev tooling) lives
# in devDependencies and must not block the build.
name: Dependencies

on:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "README.md"
      - "scripts/verifyReadme.mjs"
      - ".github/workflows/dependencies.yml"
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "README.md"
      - "scripts/verifyReadme.mjs"
      - ".github/workflows/dependencies.yml"
  schedule:
    # Weekly audit sweep, Sat 03:07 UTC.
    - cron: "7 3 * * 6"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        # No `version` input: the action reads packageManager from
        # package.json (with its sha512 integrity hash). Specifying both
        # fails the step with ERR_PNPM_BAD_PM_VERSION-style conflicts.

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Unit & integration tests
        run: pnpm test

      - name: Verify README claims
        run: pnpm docs:verify

      - name: Production build
        run: pnpm build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        # Same rule as the verify job: no `version` input here.

      # Reads pnpm-lock.yaml; no install required.
      - name: Audit production dependencies
        run: pnpm audit --prod
