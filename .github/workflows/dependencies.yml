# Compiles TypeScript, runs tests, and verifies the production build on every
# dependency update PR, so bumps that break the app fail CI instead of
# silently shipping.
#
# The audit job also runs on pushes to main: new advisories can be published
# against unchanged, locked dependency versions at any time, and the gate
# should catch those too. It audits the production dependency tree only —
# the one accepted finding (esbuild inside drizzle-kit's dev tooling) lives
# in devDependencies and must not block the build.
name: Dependencies

on:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "pnpm-lock.yaml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Unit & integration tests
        run: pnpm test

      - name: Production build
        run: pnpm build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      # Reads pnpm-lock.yaml; no install required.
      - name: Audit production dependencies
        run: pnpm audit --prod
