# Keeps the README's "Recent Changes" block in step with main automatically.
#
# Runs the generator on every push to main and commits the result, so the
# published README (github.com/nhasibuan/primecare-clinic-reimagined#recent-changes)
# always shows the last changes without anyone editing it by hand.
#
# Loop safety, in two independent layers:
#   1. The generator filters its own commits out of the list by marker, so the
#      output is byte-identical when re-run on the commit it produced.
#   2. The commit it makes via GITHUB_TOKEN does not trigger other workflows
#      (documented GitHub behaviour), and it carries [skip ci] as a second belt.
#
# fetch-depth: 0 is required — the default shallow clone only has one commit,
# which is not enough history to render the change log.

name: README changes

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: readme-changes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh README recent changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Regenerate the Recent Changes block
        run: node scripts/updateReadmeChanges.mjs

      # Loop safety, asserted rather than assumed: a second run on the output
      # just written must produce no change. If the generator ever stops being
      # idempotent (e.g. it starts listing its own commits), this fails loudly
      # instead of committing forever.
      - name: Assert the generator is idempotent
        run: node scripts/updateReadmeChanges.mjs --check

      - name: Commit if it changed
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "README recent changes already current."
            exit 0
          fi
          git config user.name "primecare-readme-bot"
          git config user.email "noreply@github.com"
          git add README.md
          git commit -F - <<'MSG'
          chore(docs): refresh README recent changes [skip ci]

          Generated by scripts/updateReadmeChanges.mjs on push to main.
          MSG
          git push
